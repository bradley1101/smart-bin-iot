; Smart bin — one ESP32 per bin.  pio run -e bin1 -t upload  /  pio run -e bin2 -t upload
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5

[env:bin1]
build_flags = -DBIN_ID=\"bin-1\"

[env:bin2]
build_flags = -DBIN_ID=\"bin-2\"
